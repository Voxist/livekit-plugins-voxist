name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Prefer the curated CHANGELOG.md section for this version; fall
          # back to the raw commit list only when no section exists.
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/changes.txt 2>/dev/null || true

          if [ -s /tmp/changes.txt ]; then
            echo "Release notes taken from CHANGELOG.md section [$VERSION]"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "No CHANGELOG section for $VERSION; listing commits from $PREV_TAG to ${{ github.ref_name }}"
              git log --pretty=format:"- %s" $PREV_TAG..${{ github.ref_name }} --no-merges > /tmp/changes.txt
            else
              echo "No CHANGELOG section and no previous tag; listing all commits"
              git log --pretty=format:"- %s" --no-merges > /tmp/changes.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/changes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
