[project]
name = "livekit-plugins-voxist"
version = "0.10.0"
description = "LiveKit STT plugin for Voxist ASR real-time streaming transcription"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Voxist", email = "contact@voxist.com"}
]
keywords = ["livekit", "stt", "speech-to-text", "asr", "voxist", "real-time", "voice-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # The plugin imports LanguageCode in addition to NOT_GIVEN/NotGivenOr.
    # LanguageCode is part of the supported API from livekit-agents 1.6.0.
    "livekit-agents>=1.6.0",
    # Matches livekit-agents' own aiohttp~=3.10 requirement.
    "aiohttp>=3.10",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    # livekit-agents 1.6.9 imports httpx at module import without declaring
    # it in requires_dist (verified against its PyPI metadata 2026-08-12);
    # CI began failing on collection when a transitive provider stopped
    # pulling httpx in. Declared here until upstream fixes its packaging.
    "httpx>=0.27",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/voxist/livekit-plugins-voxist"
Documentation = "https://github.com/voxist/livekit-plugins-voxist#readme"
Repository = "https://github.com/voxist/livekit-plugins-voxist"
Issues = "https://github.com/voxist/livekit-plugins-voxist/issues"
Changelog = "https://github.com/voxist/livekit-plugins-voxist/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["livekit.plugins.voxist"]

[tool.setuptools.package-dir]
"livekit.plugins.voxist" = "livekit/plugins/voxist"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that require live Voxist API access",
    "integration: marks integration tests with mock server",
    "benchmark: marks performance benchmark tests",
    "no_auto_mock_token: marks tests that need to test token exchange directly (skip auto-mock)",
]

[tool.coverage.run]
source = ["livekit/plugins/voxist"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
# 3.12 rather than the 3.10 runtime floor: numpy's bundled stubs use
# `type X = ...` statements that mypy only parses at 3.12+. Skipping numpy
# instead would erase ndarray types across the whole audio path - exactly the
# blindness this gate exists to prevent - and 3.10/3.11 runtime compatibility
# is covered by the pytest matrix and ruff's target-version.
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "livekit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true
